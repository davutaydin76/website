<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="description" content="Kocaeli Dilovası'nda CNC torna, işleme merkezi ve talaşlı imalat hizmetleri." />

    <!-- FOIT / FOUC önleme: React yüklenmeden önce dark sınıfı DOM'a uygulanır -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('aydin-torna-theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var isDark = stored === 'dark' || ((!stored || stored === 'system') && prefersDark)
          if (isDark) {
            document.documentElement.classList.add('dark')
          }
        } catch (_) {}
      })()
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Supabase Storage & Auth için ön bağlantı (LCP / TTFB iyileştirmesi) -->
    <link rel="preconnect" href="https://cxecudcpnoeuzxstkzwj.supabase.co" />
    <link rel="dns-prefetch" href="https://cxecudcpnoeuzxstkzwj.supabase.co" />
    <title>Aydın Torna CNC | Kocaeli Dilovası</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.warn('SW registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
